<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de peças · iatrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#4e1f85">
<link rel="icon" href="https://iatrix.com.br/img/logo.png">
<style>
:root{
  --roxo:#4E1F85; --roxo-esc:#35125E; --roxo-med:#6B35B5; --lilas:#EFE9F8; --tinta:#1E1733; --cinza:#6B6482;
  --papel:#F7F5FB; --painel:#FFFFFF; --linha:#E2DCEC; --sel:#F1E9FC;
  --grafite:var(--roxo); --aco:var(--lilas); --sinal:var(--roxo-med); --sobre-sinal:#FFFFFF;
  --fundo:var(--papel); --texto:var(--tinta); --suave:var(--cinza); --hover:var(--lilas);
  --topo:#FFFFFF; --campo:#F4F1F9; --campo-borda:#DCD4E8;
  --raio:10px; --raio-p:6px;
  --sans:"Inter","Segoe UI",Arial,sans-serif; --cond:"Poppins","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --fundo:#14101D; --painel:#1C1628; --texto:#ECE8F5; --suave:#A89FBE; --linha:#312844; --sel:#2C2145;
  --sinal:#9B6BE8; --aco:#2A2139; --hover:#251D34; --lilas:#2A2139;
  --topo:#1C1628; --campo:#251D34; --campo-borda:#3A2F50;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 var(--sans);color:var(--texto);background:var(--fundo);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sinal);outline-offset:2px}

header{background:var(--topo);color:var(--texto);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  border-bottom:1px solid var(--linha);box-shadow:0 2px 12px rgba(78,31,133,.07);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--roxo),var(--roxo-med) 60%,#A67CF0)}
.marca-topo{display:flex;align-items:center;gap:12px;white-space:nowrap}
.logo{height:30px;width:auto;display:block}
@media (prefers-color-scheme:dark){.logo{filter:brightness(0) invert(1)}}
.marca-topo .div{width:1px;height:24px;background:var(--linha)}
header h1{font:600 18px/1 var(--cond);margin:0;letter-spacing:-.2px;white-space:nowrap;color:var(--roxo)}
@media (prefers-color-scheme:dark){header h1{color:var(--texto)}}
header .base{font-size:13px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;cursor:help}
.filtros{display:flex;flex-wrap:wrap;gap:8px;flex:1;justify-content:flex-end}
.filtros input,.filtros select{background:var(--campo);border:1px solid var(--campo-borda);border-radius:var(--raio-p);padding:8px 12px;color:var(--texto);min-width:0}
.filtros input:focus,.filtros select:focus{border-color:var(--sinal);background:var(--painel)}
.filtros input::placeholder{color:var(--suave)}
#busca{flex:1 1 180px;max-width:360px}
#modelo{flex:0 1 130px}
#montadora{flex:0 1 160px}
#marca{flex:0 1 150px}
.btn{background:transparent;border:1px solid var(--campo-borda);color:var(--roxo);font-weight:600;border-radius:var(--raio-p);padding:8px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--sinal);background:var(--lilas)}
@media (prefers-color-scheme:dark){.btn{color:var(--texto)}}

main{flex:1;display:grid;grid-template-columns:300px minmax(320px,1fr) minmax(360px,1.1fr);min-height:0}
section{min-height:0;overflow:auto;border-right:1px solid var(--linha)}

/* Abas de linha */
#linhas{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 10px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--painel);z-index:1}
.aba{border:1px solid var(--linha);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;font:600 13px/1.2 var(--cond);display:flex;gap:6px;align-items:baseline}
.aba small{font:500 11px var(--sans);color:var(--suave)}
.aba:hover{border-color:var(--sinal)}
.aba[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}
.aba[aria-pressed="true"] small{color:#D9CCF0}
.aba.vazia{opacity:.5}
@media (prefers-color-scheme:dark){.aba[aria-pressed="true"]{background:var(--sinal);border-color:var(--sinal)}}
/* Árvore */
#arvore{background:var(--painel);padding:0 0 8px}
#nos{padding-top:6px}
.no{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;padding:6px 12px;cursor:pointer;border-left:3px solid transparent}
.no:hover{background:var(--hover)}
.no.ativo{border-left-color:var(--sinal);background:var(--sel);color:var(--roxo)}
@media (prefers-color-scheme:dark){.no.ativo{color:var(--texto)}}
.no .seta{width:14px;flex:none;color:var(--suave);font-size:11px;transition:transform .15s}
.no.aberto .seta{transform:rotate(90deg)}
.no .nome{flex:1;min-width:0}
.no .qtd{font:500 12px var(--sans);color:var(--suave);min-width:28px;text-align:right}
.no.vazio{opacity:.45}
.n1>.no .nome{font-weight:600}
.n2>.no{padding-left:26px}
.n3>.no{padding-left:48px;font-size:14px}
.filhos{display:none}
.aberto+.filhos{display:block}
.sep{height:1px;background:var(--linha);margin:8px 12px}

/* Lista */
#lista{padding:0}
.topo-lista{position:sticky;top:0;background:var(--fundo);padding:12px 16px;border-bottom:1px solid var(--linha);font-size:14px;color:var(--suave);z-index:1}
.topo-lista strong{color:var(--texto)}
.item{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:12px 16px;border-bottom:1px solid var(--linha);cursor:pointer;background:none;border-left:3px solid transparent;border-right:0;border-top:0;width:100%;text-align:left}
.item:hover{background:var(--hover)}
.item.ativo{background:var(--sel);border-left-color:var(--sinal)}
.item .cod{font:600 17px/1.3 var(--cond);grid-row:span 2;min-width:96px;color:var(--roxo)}
@media (prefers-color-scheme:dark){.item .cod{color:#C9B1F2}}
.item .desc{font-weight:500}
.item .pos{font-size:13px;color:var(--suave)}
.selo{display:inline-block;font:600 10.5px/1.6 var(--sans);letter-spacing:.4px;text-transform:uppercase;border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:1px;background:var(--lilas);color:var(--roxo)}
@media (prefers-color-scheme:dark){.selo{color:var(--texto)}}
.selo.m-cofap{background:#F2B705;color:#13191E}
.selo.m-mm{background:var(--roxo);color:#fff}
@media (prefers-color-scheme:dark){.selo.m-mm{background:#E6E0F2;color:#1E1733}}
.mais{display:block;margin:16px auto;background:var(--roxo);color:#fff;border:0;border-radius:999px;padding:9px 22px;font-weight:600;cursor:pointer}
.mais:hover{background:var(--roxo-esc)}
.vazio-msg{padding:32px 20px;color:var(--suave);max-width:46ch}

/* Detalhe */
#detalhe{background:var(--painel);border-right:0;padding:22px 26px 40px}
.etiqueta{display:inline-flex;align-items:center;background:linear-gradient(135deg,var(--roxo),var(--roxo-med));color:#fff;padding:8px 18px;font:700 32px/1 var(--cond);letter-spacing:-.3px;border-radius:var(--raio);box-shadow:0 6px 18px rgba(78,31,133,.25)}
#detalhe h2{font:600 20px/1.3 var(--cond);margin:16px 0 2px}
.meta{color:var(--suave);font-size:14px;margin:0 0 14px}
.fotos{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.fotos img{max-width:100%;max-height:220px;background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:6px}
.sem-foto{font-size:13px;color:var(--suave);border:1px dashed var(--linha);padding:10px 14px;border-radius:var(--raio)}
.caminhos{margin:0 0 18px;padding:0;list-style:none}
.caminhos li{font-size:14px;padding:3px 0}
.caminhos .lin{font:600 12px var(--cond);background:var(--lilas);color:var(--roxo);border-radius:999px;padding:1px 8px;margin-right:6px}
@media (prefers-color-scheme:dark){.caminhos .lin{color:var(--texto)}}
.caminhos a{color:inherit;text-decoration:underline;text-decoration-color:var(--sinal);text-underline-offset:3px;cursor:pointer}
h3{font:600 15px var(--cond);margin:24px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--sinal);display:inline-block;color:var(--roxo)}
@media (prefers-color-scheme:dark){h3{color:var(--texto)}}
.tabela{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--suave);padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap;background:var(--fundo)}
td{padding:7px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
tr:last-child td{border-bottom:0}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{border:1px solid var(--linha);border-radius:var(--raio-p);padding:3px 9px;font-size:13px}
.ref b{font-weight:600}
.obs{background:var(--sel);padding:12px 14px;border-radius:var(--raio);font-size:14px;border-left:3px solid var(--sinal)}

/* Abertura */
#abertura{position:fixed;inset:0;background:radial-gradient(1200px 600px at 80% -10%,#7A45C8 0%,transparent 60%),linear-gradient(135deg,#35125E,#4E1F85 55%,#5E2A9E);color:#fff;display:flex;align-items:center;justify-content:center;z-index:10;padding:24px}
#abertura .caixa{max-width:500px}
#abertura .logo-caixa{display:inline-flex;background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:26px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#abertura .logo-caixa .logo{height:34px;filter:none}
#abertura h2{font:700 40px/1.1 var(--cond);margin:0 0 14px;letter-spacing:-.5px}
#abertura p{color:#DCD0F0;margin:0 0 22px}
#abertura label:not([hidden]){display:inline-block;background:#fff;color:var(--roxo);font-weight:600;padding:12px 24px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:transform .15s}
#abertura label:hover{transform:translateY(-1px)}
#abertura input{position:absolute;left:-9999px}
#abertura .solta:not([hidden]){margin-top:20px;border:2px dashed rgba(255,255,255,.35);border-radius:var(--raio);padding:18px;text-align:center;color:#D2C4EC}
#abertura.arrastando .solta{border-color:#fff;color:#fff;background:rgba(255,255,255,.06)}
#abertura .erro{color:#FFC2B8;margin-top:12px}

/* Informativos */
#btn-inf[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}
body.modo-inf main{display:none}
body.modo-inf .filtros{display:none}
#informativos{display:none;flex:1;min-height:0;grid-template-columns:minmax(320px,440px) 1fr}
body.modo-inf #informativos{display:grid}
#inf-lista{background:var(--painel)}
.inf-filtros{position:sticky;top:0;z-index:1;background:var(--painel);padding:12px;border-bottom:1px solid var(--linha);display:flex;flex-wrap:wrap;gap:6px}
.inf-filtros input,.inf-filtros select{background:var(--campo);border:1px solid var(--campo-borda);border-radius:var(--raio-p);padding:7px 10px;min-width:0}
#inf-busca{flex:1 1 100%}
#inf-marca{flex:1 1 100%}
.inf-filtros select{flex:1 1 30%}
.inf-total{padding:8px 12px;font-size:14px;color:var(--suave);border-bottom:1px solid var(--linha)}
.inf-total strong{color:var(--texto)}
.inf{display:grid;grid-template-columns:56px 1fr;gap:2px 12px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--linha);border-left:3px solid transparent;padding:10px 12px;cursor:pointer}
.inf:hover{background:var(--hover)}
.inf.ativo{background:var(--sel);border-left-color:var(--sinal)}
.inf img{grid-row:span 3;width:56px;height:78px;object-fit:cover;object-position:top;background:#fff;border:1px solid var(--linha);border-radius:var(--raio-p)}
.inf .num{font:600 14px/1.3 var(--cond);color:var(--roxo)}
@media (prefers-color-scheme:dark){.inf .num{color:#C9B1F2}}
.inf .num span{font:400 13px var(--sans);color:var(--suave);margin-left:6px}
.inf .tit{font-weight:500}
.inf .cods{font-size:13px;color:var(--suave)}
#inf-ver{background:var(--fundo);padding:22px 26px 40px;border-right:0}
#inf-ver .folha{display:block;max-width:680px;width:100%;height:auto;background:#fff;border:1px solid var(--linha);border-radius:var(--raio);margin-top:14px;box-shadow:0 4px 16px rgba(30,23,51,.08)}
.prods{display:flex;flex-wrap:wrap;gap:6px}
.prods button{border:1px solid var(--linha);background:var(--painel);border-radius:var(--raio-p);padding:6px 10px;cursor:pointer;text-align:left}
.prods button:hover{border-color:var(--sinal)}
.prods b{font:600 14px var(--cond);margin-right:6px;color:var(--roxo)}
@media (prefers-color-scheme:dark){.prods b{color:#C9B1F2}}
.prods small{color:var(--suave)}
.inf-rel{display:flex;flex-wrap:wrap;gap:10px}
.inf-rel a{display:flex;gap:10px;align-items:center;border:1px solid var(--linha);border-radius:var(--raio);padding:6px 10px 6px 6px;color:inherit;text-decoration:none;cursor:pointer;max-width:320px}
.inf-rel a:hover{border-color:var(--sinal)}
.inf-rel img{width:44px;height:61px;object-fit:cover;object-position:top;background:#fff;border-radius:4px}
.inf-rel b{font:600 14px var(--cond);display:block}
.inf-rel span{font-size:13px}
.link-img{font-size:14px;color:inherit;text-decoration:underline;text-decoration-color:var(--sinal);text-underline-offset:3px}

@media (max-width:1100px){main{grid-template-columns:260px 1fr}#detalhe{grid-column:1/-1;border-top:1px solid var(--linha)}}
@media (max-width:900px){body.modo-inf #informativos{display:block;overflow:auto}#informativos section{overflow:visible;border-right:0}}
@media (max-width:700px){main{display:block;overflow:auto}section{border-right:0;overflow:visible}#arvore{max-height:40vh;overflow:auto}.marca-topo .div,header h1{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.logo-caixa:not(:has(img)),.marca-topo:not(:has(.logo)) .div{display:none}

/* ---------- Menu em galhos (árvore) ---------- */
:root{--galho:#D3CAE2}
@media (prefers-color-scheme:dark){:root{--galho:#3D3354}}
#nos{position:relative}
#nos .marcador{position:absolute;left:0;top:0;width:3px;height:0;border-radius:0 3px 3px 0;background:var(--sinal);opacity:0;pointer-events:none;z-index:2;
  transition:transform .38s cubic-bezier(.4,0,.2,1),height .38s cubic-bezier(.4,0,.2,1),opacity .2s}
.no{border-left:0}
.n1>.no{padding-left:12px}
.n2>.no{padding-left:36px}
.n3>.no{padding-left:60px}
.filhos{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1),visibility 0s .3s}
.aberto+.filhos{display:grid;grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1),visibility 0s}
.ramo{position:relative;min-height:0;overflow:hidden;--h:0px}
.n1>.filhos>.ramo{--x:19px}
.n2>.filhos>.ramo{--x:43px}
.n3>.filhos>.ramo{--x:67px}
.ramo>div{position:relative}
.ramo>div:not(:last-of-type)::before{content:"";position:absolute;left:var(--x);top:0;bottom:0;border-left:1.5px solid var(--galho)}
.ramo>div>.no{position:relative}
.ramo>div>.no::before{content:"";position:absolute;left:var(--x);top:0;height:50%;width:13px;border-left:1.5px solid var(--galho);border-bottom:1.5px solid var(--galho);border-bottom-left-radius:9px;transition:border-color .15s;z-index:1}
.ramo>.acento{position:absolute;left:var(--x);top:0;width:1.5px;height:var(--h);background:var(--sinal);z-index:1;transition:height .35s cubic-bezier(.4,0,.2,1)}
.ramo>div>.no.no-caminho::before{border-color:var(--sinal);transition:border-color .2s .28s}
.ramo>div>.no:hover::before{border-color:var(--sinal)}
.no.no-caminho:not(.ativo) .nome{color:var(--roxo)}
@media (prefers-color-scheme:dark){.no.no-caminho:not(.ativo) .nome{color:#C9B1F2}}
.no.vazio{opacity:1}.no.vazio .nome,.no.vazio .qtd,.no.vazio .seta{opacity:.45}

/* ---------- Abertura: fundo hyperspeed ---------- */
#abertura{background:#0B0616;overflow:hidden;transition:opacity .7s ease}
#abertura #hiper{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform 1.2s cubic-bezier(.5,0,.2,1)}
#abertura .caixa{position:relative;z-index:1;text-shadow:0 2px 18px rgba(11,6,22,.8)}
#abertura .barra{width:220px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:4px}
#abertura .barra::after{content:"";display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#9B6BE8,#D856BF);animation:barra 1.3s ease-in-out infinite}
@keyframes barra{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#abertura label:not([hidden]) ~ .barra{display:none}
#abertura.saindo{opacity:0;pointer-events:none}
#abertura.saindo #hiper{transform:scale(1.25)}

/* ---------- Barra de rolagem ---------- */
:root{--rolo:rgba(107,53,181,.28);--rolo-hover:linear-gradient(180deg,#6B35B5,#4E1F85)}
@media (prefers-color-scheme:dark){:root{--rolo:rgba(155,107,232,.3);--rolo-hover:linear-gradient(180deg,#B79CF0,#9B6BE8)}}
*{scrollbar-width:thin;scrollbar-color:var(--sinal) transparent}
@supports selector(::-webkit-scrollbar){*{scrollbar-width:auto;scrollbar-color:auto}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-track:vertical{background:linear-gradient(90deg,transparent 4px,var(--linha) 4px,var(--linha) 6px,transparent 6px)}
::-webkit-scrollbar-track:horizontal{background:linear-gradient(180deg,transparent 4px,var(--linha) 4px,var(--linha) 6px,transparent 6px)}
::-webkit-scrollbar-thumb{background:var(--rolo);border:3px solid transparent;background-clip:padding-box;border-radius:999px;min-height:40px}
section:hover::-webkit-scrollbar-thumb,.tabela:hover::-webkit-scrollbar-thumb{background:var(--rolo-hover);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-thumb:hover{background:var(--rolo-hover);background-clip:padding-box;border-width:2px}
::-webkit-scrollbar-thumb:active{background:linear-gradient(180deg,#D856BF,#7A45C8);background-clip:padding-box;border-width:2px}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none}
/* traçado aceso: acima dos galhos cinza, do topo do ramo até o item */
.ramo>.acento{z-index:3;width:2px;margin-left:-.25px;box-shadow:0 0 6px var(--sinal)}
.ramo>div>.no.no-caminho::before{z-index:4;border-left-width:2px;border-bottom-width:2px;filter:drop-shadow(0 0 3px var(--sinal))}
</style>
</head>
<body>

<div id="abertura">
  <canvas id="hiper" aria-hidden="true"></canvas>
  <div class="caixa">
    <div class="logo-caixa"><img class="logo" src="img/logo-iatrix.svg" alt="iatrix" onerror="if(!this.dataset.r){this.dataset.r=1;this.src='https://iatrix.com.br/img/svg/logo.svg'}else{this.remove()}"></div>
    <h2>Catálogo de peças</h2>
    <p>Abra o arquivo <b>catalogo_sistema.db</b> para carregar os produtos e a árvore de classificação.</p>
    <label for="arquivo">Abrir banco de dados</label>
    <input type="file" id="arquivo" accept=".db,.sqlite">
    <div class="solta">ou arraste o arquivo .db para cá</div>
    <div class="erro" id="erro-abertura"></div>
    <div class="barra" aria-hidden="true"></div>
  </div>
</div>
<script>
// Fundo "hyperspeed" da abertura: estrada em perspectiva com rastros de luz (canvas 2D, sem bibliotecas)
(function () {
  const ab = document.getElementById("abertura"), cv = document.getElementById("hiper");
  if (!ab || !cv) return;
  // enquanto o banco carrega: esconde o botão e mostra "Carregando"
  ab.querySelectorAll("label, .solta").forEach(el => el.hidden = true);
  const p = ab.querySelector("p"); if (p) p.textContent = "Carregando o catálogo…";

  const ctx = cv.getContext("2d");
  const reduzir = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COR_ESQ = ["#D856BF", "#9B6BE8", "#C247AC", "#7A45C8"];   // indo embora (esquerda)
  const COR_DIR = ["#FFFFFF", "#D9CCF0", "#8FD3FF", "#B79CF0"];   // vindo (direita)
  const LARG = 10, ILHA = 1.2, FAIXAS = 3, LONGE = 320, PERTO = 0.6, ALT = 4.2;
  let W = 0, H = 0, dpr = 1, f = 0, cx = 0, hy = 0;
  let vel = 1, alvo = 1, t0 = performance.now(), desloc = 0, raf = 0;

  function medir() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; hy = H * 0.46; f = Math.max(W, H) * 0.55;
  }
  const px = (x, z) => cx + (x / z) * f;
  const py = (y, z) => hy + ((ALT - y) / z) * f;
  const sorteia = a => a[(Math.random() * a.length) | 0];
  const rnd = (a, b) => a + Math.random() * (b - a);

  // carros: cada um tem dois faróis/lanternas
  const carros = [];
  function novoCarro(lado, zIni) {
    const faixa = (Math.random() * FAIXAS) | 0, lw = LARG / FAIXAS;
    const x0 = lado < 0 ? -ILHA - lw * (faixa + 0.5) : ILHA + lw * (faixa + 0.5);
    return { lado, x: x0 + rnd(-0.6, 0.6), z: zIni ?? (lado < 0 ? rnd(PERTO, LONGE) : rnd(20, LONGE)),
      comp: rnd(12, 46), v: lado < 0 ? rnd(40, 70) : -rnd(110, 170), cor: sorteia(lado < 0 ? COR_ESQ : COR_DIR),
      larg: rnd(0.12, 0.2), sep: rnd(0.9, 1.2) };
  }
  for (let i = 0; i < 70; i++) carros.push(novoCarro(-1));
  for (let i = 0; i < 70; i++) carros.push(novoCarro(1));

  function faixaLuz(x, zA, zB, larg, cor) {   // rastro afinando para o fundo
    const z1 = Math.max(zA, PERTO), z2 = Math.min(zB, LONGE);
    if (z2 <= z1) return;
    const y = 0.25;
    const g = ctx.createLinearGradient(px(x, z1), py(y, z1), px(x, z2), py(y, z2));
    g.addColorStop(0, cor); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(px(x - larg, z1), py(y, z1)); ctx.lineTo(px(x + larg, z1), py(y, z1));
    ctx.lineTo(px(x + larg, z2), py(y, z2)); ctx.lineTo(px(x - larg, z2), py(y, z2));
    ctx.fill();
  }

  function quad(x1, x2, z1, z2, y, cor) {
    ctx.fillStyle = cor; ctx.beginPath();
    ctx.moveTo(px(x1, z1), py(y, z1)); ctx.lineTo(px(x2, z1), py(y, z1));
    ctx.lineTo(px(x2, z2), py(y, z2)); ctx.lineTo(px(x1, z2), py(y, z2)); ctx.fill();
  }

  function desenhar(dt) {
    vel += (alvo - vel) * Math.min(1, dt * 3);
    desloc += dt * 90 * vel;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#0B0616"; ctx.fillRect(0, 0, W, H);
    // brilho no horizonte
    const hz = ctx.createRadialGradient(cx, hy, 0, cx, hy, Math.max(W, H) * 0.6);
    hz.addColorStop(0, "rgba(122,69,200,.45)"); hz.addColorStop(.35, "rgba(78,31,133,.18)"); hz.addColorStop(1, "rgba(11,6,22,0)");
    ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);
    // pistas e ilha
    quad(-ILHA - LARG, -ILHA, PERTO, LONGE, 0, "#120B22");
    quad(ILHA, ILHA + LARG, PERTO, LONGE, 0, "#120B22");
    quad(-ILHA, ILHA, PERTO, LONGE, 0, "#0D0819");
    // faixas tracejadas
    const passo = 14, tr = 6, lw = LARG / FAIXAS;
    for (const lado of [-1, 1]) for (let k = 1; k < FAIXAS; k++) {
      const x = lado * (ILHA + lw * k);
      for (let z = passo - (desloc % passo); z < LONGE; z += passo) {
        const a = Math.max(0, 1 - z / LONGE) * .55;
        quad(x - .06, x + .06, Math.max(z, PERTO), z + tr, 0.01, `rgba(200,182,240,${a})`);
      }
    }
    // postes de luz nas bordas da ilha
    ctx.globalCompositeOperation = "lighter";
    const pp = 22;
    for (let z = pp - (desloc % pp) + 4; z < LONGE; z += pp) for (const x of [-ILHA + .15, ILHA - .15]) {
      const a = Math.max(0, 1 - z / LONGE);
      ctx.strokeStyle = `rgba(155,107,232,${a * .8})`; ctx.lineWidth = Math.max(1, 0.12 * f / z);
      ctx.beginPath(); ctx.moveTo(px(x, z), py(0, z)); ctx.lineTo(px(x, z), py(1.1, z)); ctx.stroke();
    }
    // rastros dos carros
    for (let i = 0; i < carros.length; i++) {
      const c = carros[i];
      c.z += c.v * dt * vel;
      if (c.z > LONGE + c.comp || c.z + c.comp < 0) {
        carros[i] = novoCarro(c.lado, c.lado < 0 ? rnd(PERTO, 20) : LONGE + rnd(0, 60)); continue;
      }
      const comp = c.comp * (0.6 + vel * 0.4);
      const zA = c.z, zB = c.z + comp;
      for (const d of [-c.sep / 2, c.sep / 2]) {
        ctx.globalAlpha = .35; faixaLuz(c.x + d, zA, zB, c.larg * 3, c.cor);   // halo
        ctx.globalAlpha = 1; faixaLuz(c.x + d, zA, zB, c.larg, c.cor);
      }
    }
    ctx.globalAlpha = 1;
    // vinheta
    ctx.globalCompositeOperation = "source-over";
    const vg = ctx.createRadialGradient(cx, H * .5, Math.min(W, H) * .3, cx, H * .5, Math.max(W, H) * .8);
    vg.addColorStop(0, "rgba(11,6,22,0)"); vg.addColorStop(1, "rgba(11,6,22,.75)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  function loop(t) {
    if (!document.body.contains(cv)) { cancelAnimationFrame(raf); removeEventListener("resize", medir); return; }
    const dt = Math.min(.05, (t - t0) / 1000); t0 = t;
    desenhar(dt);
    raf = requestAnimationFrame(loop);
  }
  medir(); addEventListener("resize", medir);
  if (reduzir) { desenhar(0); addEventListener("resize", () => desenhar(0)); }
  else raf = requestAnimationFrame(loop);

  // acelera enquanto segura o clique (como no original) e na saída
  ab.addEventListener("pointerdown", e => { if (!e.target.closest("label, .solta")) alvo = 4; });
  addEventListener("pointerup", () => { if (alvo < 6) alvo = 1; });
  window.hiper = { acelerar() { alvo = 8; } };
})();
</script>

<script src="lib/sql-wasm-bin.js"></script>
<script src="lib/catalogo_db.js?v=20260928g" onerror="void 0"></script>
<script>
"use strict";
let db = null;
let linhas = [], linhaPorId = new Map();
let porId = new Map(), filhosDe = new Map();
const estado = { linha: 1, no: null, busca: "", marca: "", montadora: "", modelo: "", limite: 100, produto: null };
let temMarca = false;
const classeMarca = m => /cofap/i.test(m || "") ? "m-cofap" : /marelli/i.test(m || "") ? "m-mm" : "";
const selo = m => m ? `<span class="selo ${classeMarca(m)}">${esc(m)}</span>` : "";
let pastaFotos = "FotoProd/";
if (location.protocol.startsWith("http")) document.getElementById("cfg-fotos").hidden = true;  // no site as fotos vêm sempre de FotoProd/
try { pastaFotos = localStorage.getItem("pastaFotos") || pastaFotos; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pesq = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const semAcento = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

function q(sql, params = []) {
  const st = db.prepare(sql); st.bind(params);
  const out = []; while (st.step()) out.push(st.getAsObject()); st.free(); return out;
}

/* ---------- Abertura do banco ---------- */
async function iniciarSql() {
  const bin = Uint8Array.from(atob(window.SQL_WASM_B64), c => c.charCodeAt(0));
  return initSqlJs({ wasmBinary: bin });
}
const sqlPronto = iniciarSql();

async function abrirBytes(buf) {
  try {
    const SQL = await sqlPronto;
    db = new SQL.Database(new Uint8Array(buf));
    let versao = "invalido";
    try { q("SELECT 1 FROM arvore LIMIT 1"); versao = "antigo"; q("SELECT 1 FROM linha LIMIT 1"); versao = "ok"; } catch (e) {}
    if (versao !== "ok") throw new Error(versao);
    montar();
    const abt = $("#abertura"); window.hiper?.acelerar(); abt.classList.add("saindo"); setTimeout(() => abt.remove(), 750);
  } catch (e) {
    db = null;
    $("#abertura").querySelectorAll("label, .solta").forEach(el => el.hidden = false);
    $("#abertura p").textContent = "Abra o arquivo catalogo_sistema.db para carregar os produtos e as árvores.";
    $("#erro-abertura").textContent = e.message === "antigo"
      ? "O banco carregado é de uma versão anterior (sem as árvores por linha). Atualize lib/catalogo_db.js e catalogo_sistema.db junto com este index.html."
      : "Este arquivo não é o banco do catálogo (esperado: catalogo_sistema.db).";
  }
}
$("#arquivo").addEventListener("change", e => { const f = e.target.files[0]; if (f) f.arrayBuffer().then(abrirBytes); });
const ab = $("#abertura");
ab.addEventListener("dragover", e => { e.preventDefault(); ab.classList.add("arrastando"); });
ab.addEventListener("dragleave", () => ab.classList.remove("arrastando"));
ab.addEventListener("drop", e => { e.preventDefault(); ab.classList.remove("arrastando"); const f = e.dataTransfer.files[0]; if (f) f.arrayBuffer().then(abrirBytes); });
// abre automaticamente: 1) banco embutido em lib/catalogo_db.js  2) catalogo_sistema.db via http
if (window.CATALOGO_DB_B64) {
  ab.querySelector("p").textContent = "Carregando o catálogo…";
  ab.querySelectorAll("label, .solta").forEach(el => el.hidden = true);
  setTimeout(() => {
    const bin = Uint8Array.from(atob(window.CATALOGO_DB_B64), c => c.charCodeAt(0));
    window.CATALOGO_DB_B64 = null;
    abrirBytes(bin.buffer);
  }, 0);
} else if (location.protocol.startsWith("http")) {
  fetch("catalogo_sistema.db").then(r => r.ok ? r.arrayBuffer() : null).then(b => b ? abrirBytes(b) : pedirArquivo()).catch(pedirArquivo);
} else pedirArquivo();
function pedirArquivo() {
  ab.querySelectorAll("label, .solta").forEach(el => el.hidden = false);
  ab.querySelector("p").innerHTML = "Abra o arquivo <b>catalogo_sistema.db</b> para carregar os produtos e a árvore de classificação.";
}

/* ---------- Montagem ---------- */
function montar() {
  const o = Object.fromEntries(q("SELECT chave, valor FROM origem").map(r => [r.chave, r.valor]));
  const dataBr = d => (d || "").split("-").reverse().join("/");
  const bases = Object.keys(o).filter(k => k.startsWith("base_")).map(k => o[k].split("|"));
  if (bases.length > 1) {
    const datas = bases.map(b => b[1]).sort();
    $("#base").textContent = datas[0] === datas.at(-1) ? `Bases de ${dataBr(datas[0])}` : `Bases de ${dataBr(datas[0]).slice(0, 5)} a ${dataBr(datas.at(-1))}`;
    $("#base").title = bases.map(b => `${b[0]}: emissão ${dataBr(b[1])}, versão ${b[2]}`).join("\n");
  } else $("#base").textContent = `Base Cofap v${o.versao} de ${dataBr(o.data_emissao)}`;
  try {
    const ms = q("SELECT marca, COUNT(*) n FROM produto WHERE marca IS NOT NULL GROUP BY marca ORDER BY marca");
    temMarca = ms.length > 1;
    if (temMarca) {
      $("#marca").innerHTML += ms.map(m => `<option value="${esc(m.marca)}">${esc(m.marca)}</option>`).join("");
      $("#marca").hidden = false;
    }
  } catch (e) { temMarca = false; }
  linhas = q("SELECT id, nome FROM linha ORDER BY id");
  linhas.forEach(l => linhaPorId.set(l.id, l));
  for (const n of q("SELECT id, linha_id, pai_id, nivel, nome, caminho FROM arvore ORDER BY ordem")) {
    porId.set(n.id, n);
    const k = n.pai_id ?? "raiz" + n.linha_id;
    if (!filhosDe.has(k)) filhosDe.set(k, []);
    filhosDe.get(k).push(n);
  }
  $("#linhas").innerHTML = linhas.map(l => `<button class="aba" data-linha="${l.id}" aria-pressed="${l.id === estado.linha}">${esc(l.nome)} <small data-ql="${l.id}"></small></button>`).join("");
  $("#linhas").addEventListener("click", e => { const b = e.target.closest(".aba"); if (b) trocarLinha(+b.dataset.linha); });
  trocarLinha(estado.linha);
  montarInformativos();
}

function trocarLinha(id, noInicial) {
  estado.linha = id; estado.no = noInicial ?? null;
  document.querySelectorAll(".aba").forEach(b => b.setAttribute("aria-pressed", +b.dataset.linha === id));
  // montadoras com veículos nesta linha
  const atual = estado.montadora;
  const ms = q("SELECT DISTINCT f.id, f.nome FROM fabricante f JOIN aplicacao a ON a.montadora_id = f.id WHERE a.linha_id = ? ORDER BY f.nome", [id]);
  $("#montadora").innerHTML = `<option value="">Todas as montadoras</option>` + ms.map(r => `<option value="${r.id}">${esc(r.nome)}</option>`).join("");
  estado.montadora = ms.some(m => String(m.id) === atual) ? atual : "";
  $("#montadora").value = estado.montadora;
  desenharArvore();
  if (noInicial) selecionarNo(noInicial, true); else atualizar();
}

function folhas(id) {
  const f = filhosDe.get(id); if (!f) return [id];
  return f.flatMap(c => folhas(c.id));
}

/* ---------- Filtros → SQL ---------- */
function clausulaFiltros(linha = estado.linha, comVeiculo = true) {
  const w = ["p.id IN (SELECT produto_id FROM produto_linha WHERE linha_id = ?)"], p = [linha];
  if (estado.marca) { w.push("p.marca = ?"); p.push(estado.marca); }
  if (estado.busca) {
    const cod = pesq(estado.busca);
    const palavras = semAcento(estado.busca).split(/\s+/).filter(Boolean);
    const partes = [];
    if (cod.length >= 2) {
      partes.push("p.codigo_pesq LIKE ?", "p.id IN (SELECT produto_id FROM referencia_cruzada WHERE codigo_pesq LIKE ?)");
      p.push(cod + "%", cod + "%");
    }
    if (palavras.length) { partes.push("(" + palavras.map(() => "p.texto_busca LIKE ?").join(" AND ") + ")"); p.push(...palavras.map(x => "%" + x + "%")); }
    if (partes.length) w.push("(" + partes.join(" OR ") + ")");
  }
  if (comVeiculo && (estado.montadora || estado.modelo)) {
    const s = ["a.linha_id = ?"]; p.push(linha);
    if (estado.montadora) { s.push("a.montadora_id = ?"); p.push(+estado.montadora); }
    if (estado.modelo) { s.push("a.modelo LIKE ?"); p.push("%" + estado.modelo + "%"); }
    w.push(`p.id IN (SELECT pa.produto_id FROM produto_aplicacao pa JOIN aplicacao a ON a.id = pa.aplicacao_id WHERE ${s.join(" AND ")})`);
  }
  return { w, p };
}
const SEM_CLASSIF = "p.id NOT IN (SELECT pa.produto_id FROM produto_arvore pa JOIN arvore a ON a.id = pa.arvore_id WHERE a.linha_id = ?)";

function atualizar() {
  estado.limite = 100;
  contarLinhas();
  contarArvore();
  desenharLista();
}

function contarLinhas() {
  for (const l of linhas) {
    const { w, p } = clausulaFiltros(l.id, l.id === estado.linha);
    const n = q(`SELECT COUNT(*) c FROM produto p WHERE ${w.join(" AND ")}`, p)[0].c;
    const el = document.querySelector(`[data-ql="${l.id}"]`);
    el.textContent = n.toLocaleString("pt-BR");
    el.parentElement.classList.toggle("vazia", !n);
  }
}

/* ---------- Árvore ---------- */
function desenharArvore() {
  const html = [];
  const rec = (k) => {
    for (const n of filhosDe.get(k) || []) {
      const temFilhos = filhosDe.has(n.id);
      html.push(`<div class="n${n.nivel}"><button class="no" data-id="${n.id}" aria-expanded="false"><span class="seta">${temFilhos ? "▶" : ""}</span><span class="nome">${esc(n.nome)}</span><span class="qtd" data-q="${n.id}"></span></button>`);
      if (temFilhos) { html.push('<div class="filhos"><div class="ramo"><i class="acento"></i>'); rec(n.id); html.push("</div></div>"); }
      html.push("</div>");
    }
  };
  html.push(`<div class="n1"><button class="no ativo" data-id="todos"><span class="seta"></span><span class="nome">Todos os produtos</span><span class="qtd" data-q="todos"></span></button></div>`);
  rec("raiz" + estado.linha);
  html.push(`<div class="sep"></div><div class="n1"><button class="no" data-id="sem"><span class="seta"></span><span class="nome">Sem classificação</span><span class="qtd" data-q="sem"></span></button></div>`);
  $("#nos").innerHTML = '<i class="marcador"></i>' + html.join("");
  atualizarGalhos();
}
// Menu em galhos: tronco com curva até cada filho, linha de destaque até o item ativo e marcador na seção aberta
function atualizarGalhos() {
  const nos = $("#nos");
  nos.querySelectorAll(".no-caminho").forEach(x => x.classList.remove("no-caminho"));
  nos.querySelectorAll(".ramo").forEach(r => r.style.setProperty("--h", "0px"));
  const at = nos.querySelector(".no.ativo"), m = nos.querySelector(".marcador");
  let d = at && at.parentElement, secao = null;
  while (d && d !== nos) {
    const r = d.parentElement;
    if (r && r.classList.contains("ramo")) {
      d.firstElementChild.classList.add("no-caminho");
      r.style.setProperty("--h", d.offsetTop + "px");
      d = r.parentElement.parentElement;
    } else { secao = d.firstElementChild; break; }
  }
  if (!m) return;
  if (secao) { m.style.transform = `translateY(${secao.offsetTop}px)`; m.style.height = secao.offsetHeight + "px"; m.style.opacity = 1; }
  else m.style.opacity = 0;
}
let rafGalhos = 0;
function acompanharGalhos(ms = 380) {  // recalcula durante a animação de abrir/fechar
  cancelAnimationFrame(rafGalhos);
  const fim = performance.now() + ms;
  const passo = () => { atualizarGalhos(); if (performance.now() < fim) rafGalhos = requestAnimationFrame(passo); };
  passo();
}
$("#nos").addEventListener("click", e => {
  const b = e.target.closest(".no"); if (!b) return;
  const id = b.dataset.id;
  const temFilhos = b.nextElementSibling && b.nextElementSibling.classList.contains("filhos");
  if (temFilhos) { b.classList.toggle("aberto"); b.setAttribute("aria-expanded", b.classList.contains("aberto")); }
  selecionarNo(id === "todos" ? null : id === "sem" ? "sem" : +id);
});

function selecionarNo(id, abrir) {
  estado.no = id;
  document.querySelectorAll(".no.ativo").forEach(x => x.classList.remove("ativo"));
  const b = document.querySelector(`.no[data-id="${id ?? "todos"}"]`);
  if (b) {
    b.classList.add("ativo");
    if (abrir) { let el = b.parentElement; while (el && el.id !== "nos") { if (el.classList.contains("filhos")) el.previousElementSibling.classList.add("aberto"); el = el.parentElement; } b.scrollIntoView({ block: "nearest" }); }
  }
  acompanharGalhos();
  estado.limite = 100; contarArvore(); desenharLista();
}

function contarArvore() {
  const { w, p } = clausulaFiltros();
  const where = w.join(" AND ");
  const pares = q(`SELECT pa.arvore_id AS a, pa.produto_id AS p FROM produto_arvore pa JOIN arvore ar ON ar.id = pa.arvore_id
                   JOIN produto p ON p.id = pa.produto_id WHERE ar.linha_id = ? AND ${where}`, [estado.linha, ...p]);
  const conj = new Map();
  const add = (id, pid) => { if (!conj.has(id)) conj.set(id, new Set()); conj.get(id).add(pid); };
  for (const { a, p: pid } of pares) { let n = porId.get(a); while (n) { add(n.id, pid); n = porId.get(n.pai_id); } }
  document.querySelectorAll("[data-q]").forEach(el => {
    const k = el.dataset.q; let v;
    if (k === "todos") v = q(`SELECT COUNT(*) c FROM produto p WHERE ${where}`, p)[0].c;
    else if (k === "sem") v = q(`SELECT COUNT(*) c FROM produto p WHERE ${where} AND ${SEM_CLASSIF}`, [...p, estado.linha])[0].c;
    else v = conj.get(+k)?.size || 0;
    el.textContent = v || "";
    el.closest(".no").classList.toggle("vazio", !v);
  });
}

/* ---------- Lista ---------- */
function desenharLista() {
  const { w, p } = clausulaFiltros();
  if (estado.no === "sem") { w.push(SEM_CLASSIF); p.push(estado.linha); }
  else if (estado.no != null) w.push(`p.id IN (SELECT produto_id FROM produto_arvore WHERE arvore_id IN (${folhas(estado.no).join(",")}))`);
  const where = "WHERE " + w.join(" AND ");
  const total = q(`SELECT COUNT(*) c FROM produto p ${where}`, p)[0].c;
  const rows = q(`SELECT p.id, p.codigo, p.descricao, p.posicao, p.linha_cofap${temMarca ? ", p.marca" : ""} FROM produto p ${where} ORDER BY p.descricao, p.codigo LIMIT ${estado.limite}`, p);
  const nomeLinha = linhaPorId.get(estado.linha).nome;
  const titulo = estado.no === "sem" ? `${nomeLinha} > Sem classificação` : estado.no ? `${nomeLinha} > ${porId.get(estado.no).caminho}` : nomeLinha;
  let html = `<div class="topo-lista"><strong>${total.toLocaleString("pt-BR")}</strong> produto${total === 1 ? "" : "s"} em ${esc(titulo)}</div>`;
  if (!rows.length) {
    const outras = linhas.filter(l => l.id !== estado.linha).map(l => {
      const f = clausulaFiltros(l.id, false); return [l, q(`SELECT COUNT(*) c FROM produto p WHERE ${f.w.join(" AND ")}`, f.p)[0].c];
    }).filter(x => x[1]);
    const semProdutosNaLinha = !q("SELECT 1 FROM produto_linha WHERE linha_id = ? LIMIT 1", [estado.linha]).length;
    html += semProdutosNaLinha
      ? `<p class="vazio-msg">Nenhum produto do catálogo Cofap tem aplicação na linha ${esc(nomeLinha)}. A árvore está carregada e passa a ser usada quando houver produtos.</p>`
      : `<p class="vazio-msg">Nenhum produto com esses filtros nesta linha.${outras.length && estado.busca ? " A busca encontra resultados em: " + outras.map(([l, n]) => `<a href="#" data-ir="${l.id}">${esc(l.nome)} (${n})</a>`).join(", ") + "." : " Tente outro modelo, outra montadora ou limpe a busca."}</p>`;
  }
  for (const r of rows)
    html += `<button class="item${r.id === estado.produto ? " ativo" : ""}" data-id="${r.id}"><span class="cod">${esc(r.codigo)}</span><span class="desc">${esc(r.descricao)}${r.linha_cofap ? " " + esc(r.linha_cofap) : ""}</span><span class="pos">${temMarca ? selo(r.marca) : ""}${esc(r.posicao || "")}</span></button>`;
  if (total > rows.length) html += `<button class="mais" id="mais">Mostrar mais ${Math.min(100, total - rows.length)}</button>`;
  $("#lista").innerHTML = html;
  $("#mais")?.addEventListener("click", () => { estado.limite += 100; const y = $("#lista").scrollTop; desenharLista(); $("#lista").scrollTop = y; });
}
$("#lista").addEventListener("click", e => {
  const ir = e.target.closest("[data-ir]"); if (ir) { e.preventDefault(); trocarLinha(+ir.dataset.ir); return; }
  const b = e.target.closest(".item"); if (!b) return;
  mostrarProduto(+b.dataset.id);
  document.querySelectorAll(".item.ativo").forEach(x => x.classList.remove("ativo")); b.classList.add("ativo");
});

/* ---------- Fotos ---------- */
// Em site publicado (http/https) um caminho file:/// salvo antes não funciona: usa a pasta ao lado da página.
function pastaEfetiva() {
  return location.protocol.startsWith("http") && /^file:/i.test(pastaFotos) ? "FotoProd/" : pastaFotos;
}
// Servidores Linux (GitHub Pages) diferenciam maiúsculas: tenta minúsculas, original e maiúsculas.
function carregarFoto(img) {
  const f = img.dataset.foto, base = pastaEfetiva();
  const ponto = f.lastIndexOf(".");
  const nome = ponto > 0 ? f.slice(0, ponto) : f, ext = ponto > 0 ? f.slice(ponto) : "";
  const tentativas = [...new Set([f.toLowerCase(), f, nome + ext.toLowerCase(), nome + ext.toUpperCase(), f.toUpperCase()])]
    .map(n => base + encodeURIComponent(n));
  let i = 0;
  img.onerror = () => {
    if (++i < tentativas.length) { img.src = tentativas[i]; return; }
    const aviso = document.createElement("span");
    aviso.className = "sem-foto";
    aviso.textContent = `Foto não encontrada: ${new URL(tentativas[0], location.href).href}`;
    img.replaceWith(aviso);
  };
  img.src = tentativas[0];
}

/* ---------- Detalhe ---------- */
function mostrarProduto(id) {
  estado.produto = id;
  const p = q("SELECT * FROM produto WHERE id = ?", [id])[0];
  const cam = q(`SELECT a.id, a.caminho, l.id AS lid, l.nome AS linha FROM produto_arvore pa JOIN arvore a ON a.id = pa.arvore_id
                 JOIN linha l ON l.id = a.linha_id WHERE pa.produto_id = ? ORDER BY l.id, a.ordem`, [id]);
  const lins = q(`SELECT l.nome FROM produto_linha pl JOIN linha l ON l.id = pl.linha_id WHERE pl.produto_id = ? ORDER BY l.id`, [id]).map(r => r.nome);
  const apl = q(`SELECT l.nome linha, f.nome montadora, a.modelo, a.complemento, a.anos, a.complemento3, a.complemento4 FROM produto_aplicacao pa
                 JOIN aplicacao a ON a.id = pa.aplicacao_id LEFT JOIN fabricante f ON f.id = a.montadora_id
                 JOIN linha l ON l.id = a.linha_id
                 WHERE pa.produto_id = ? ORDER BY l.id, f.nome, a.modelo, a.anos`, [id]);
  const refs = q(`SELECT f.nome marca, r.codigo FROM referencia_cruzada r LEFT JOIN fabricante f ON f.id = r.marca_id
                  WHERE r.produto_id = ? ORDER BY f.nome, r.codigo`, [id]);
  const fotos = [p.foto, p.foto2, p.foto3].filter(Boolean);
  let h = `<div class="etiqueta">${esc(p.codigo)}</div>
    <h2>${esc(p.descricao)}${p.linha_cofap ? " " + esc(p.linha_cofap) : ""}</h2>
    <p class="meta">${temMarca ? selo(p.marca) : ""}${p.posicao ? esc(p.posicao) + " · " : (!temMarca || p.marca === "Cofap" ? "Posição não informada · " : "")}Grupo: ${esc(p.grupo_cofap || "—")}${p.unidade ? " · Unidade: " + esc(p.unidade) : ""} · Linha: ${esc(lins.join(", "))}</p>
    <div class="fotos">${fotos.map(f => `<img alt="Foto ${esc(p.codigo)}" data-foto="${esc(f)}">`).join("") || '<span class="sem-foto">Produto sem foto cadastrada</span>'}</div>
    <h3>Na árvore</h3>
    <ul class="caminhos">${cam.length ? cam.map(c => `<li><span class="lin">${esc(c.linha)}</span><a data-no="${c.id}" data-lin="${c.lid}">${esc(c.caminho)}</a></li>`).join("") : "<li>Sem classificação nas árvores</li>"}</ul>`;
  if (p.observacao) h += `<h3>Observação</h3><div class="obs">${esc(p.observacao)}</div>`;
  if (temInf) {
    const infs = q(`SELECT i.id, i.numero, i.data, i.titulo, i.imagem FROM informativo_produto x JOIN informativo i ON i.id = x.informativo_id
                    WHERE x.produto_id = ? ORDER BY i.data DESC, i.ordem DESC`, [id]);
    if (infs.length) h += `<h3>Informativos técnicos (${infs.length})</h3><div class="inf-rel">${infs.map(i =>
      `<a data-inf="${i.id}" href="#">${miniatura(i, 44)}<span><b>${esc(i.numero)} · ${dataCurta(i.data)}</b>${esc(i.titulo)}</span></a>`).join("")}</div>`;
  }
  h += `<h3>Aplicações (${apl.length})</h3>`;
  h += apl.length ? `<div class="tabela"><table><thead><tr><th>Linha</th><th>Montadora</th><th>Modelo</th><th>Complemento</th><th>Anos</th></tr></thead><tbody>${apl.map(a => `<tr><td>${esc(a.linha)}</td><td>${esc(a.montadora)}</td><td>${esc(a.modelo)}</td><td>${esc([a.complemento, a.complemento3, a.complemento4].filter(Boolean).join(" · "))}</td><td>${esc(a.anos)}</td></tr>`).join("")}</tbody></table></div>` : "<p>Sem aplicações cadastradas.</p>";
  h += `<h3>Referências cruzadas (${refs.length})</h3>`;
  h += refs.length ? `<div class="refs">${refs.map(r => `<span class="ref"><b>${esc(r.marca)}</b> ${esc(r.codigo)}</span>`).join("")}</div>` : "<p>Sem referências cruzadas.</p>";
  $("#detalhe").innerHTML = h;
  $("#detalhe").scrollTop = 0;
  document.querySelectorAll("#detalhe img[data-foto]").forEach(carregarFoto);
}
$("#detalhe").addEventListener("click", e => {
  const inf = e.target.closest("[data-inf]"); if (inf) { e.preventDefault(); modoInformativos(true, +inf.dataset.inf); return; }
  const a = e.target.closest("[data-no]"); if (!a) return;
  const lin = +a.dataset.lin;
  if (lin !== estado.linha) trocarLinha(lin, +a.dataset.no); else selecionarNo(+a.dataset.no, true);
});

/* ---------- Eventos de filtro ---------- */
let t;
const aoDigitar = (campo) => e => { clearTimeout(t); t = setTimeout(() => { estado[campo] = e.target.value.trim(); atualizar(); }, 250); };
$("#busca").addEventListener("input", aoDigitar("busca"));
$("#modelo").addEventListener("input", aoDigitar("modelo"));
$("#montadora").addEventListener("change", e => { estado.montadora = e.target.value; atualizar(); });
$("#marca").addEventListener("change", e => { estado.marca = e.target.value; atualizar(); });
$("#limpar").addEventListener("click", () => {
  $("#busca").value = $("#modelo").value = $("#montadora").value = $("#marca").value = "";
  Object.assign(estado, { busca: "", modelo: "", montadora: "", marca: "" });
  atualizar();
});
$("#cfg-fotos").addEventListener("click", () => {
  const v = prompt("Pasta das fotos (relativa a este arquivo ou caminho completo, ex.: file:///C:/ProgramData/CatalogoProdutosCofap/FotoProd/)", pastaFotos);
  if (v == null) return;
  pastaFotos = v.endsWith("/") ? v : v + "/";
  try { localStorage.setItem("pastaFotos", pastaFotos); } catch (e) {}
  if (estado.produto) mostrarProduto(estado.produto);
});

/* ---------- Informativos técnicos ---------- */
let temInf = false;
const infEstado = { busca: "", marca: "", cat: "", ano: "", mes: "", sel: null };
let infTemMarca = false;
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const dataCurta = d => d ? `${MESES[+d.slice(5, 7) - 1]}/${d.slice(0, 4)}` : "";
const dataLonga = d => d ? d.split("-").reverse().join("/") : "";
// miniatura em Informativos/mini/; se não existir, usa a imagem inteira
function miniatura(i, w) {
  if (!i.imagem) return "";
  const mini = i.imagem.replace(/^Informativos\/(\d+)\.\w+$/, "Informativos/mini/$1.jpg");
  return `<img loading="lazy" alt="" width="${w}" src="${esc(mini)}" onerror="this.onerror=null;this.src='${esc(i.imagem)}'">`;
}

function montarInformativos() {
  try { temInf = q("SELECT COUNT(*) c FROM informativo")[0].c > 0; } catch (e) { temInf = false; }
  if (!temInf) return;
  $("#btn-inf").hidden = false;
  try {
    const ms = q("SELECT marca, COUNT(*) n FROM informativo WHERE marca IS NOT NULL GROUP BY marca ORDER BY marca");
    infTemMarca = ms.length > 1;
    if (infTemMarca) { $("#inf-marca").innerHTML += ms.map(r => `<option value="${esc(r.marca)}">${esc(r.marca)} (${r.n})</option>`).join(""); $("#inf-marca").hidden = false; }
  } catch (e) { infTemMarca = false; }
  $("#inf-cat").innerHTML += q("SELECT categoria, COUNT(*) n FROM informativo GROUP BY categoria ORDER BY categoria")
    .map(r => `<option value="${esc(r.categoria)}">${esc(r.categoria)} (${r.n})</option>`).join("");
  $("#inf-ano").innerHTML += q("SELECT DISTINCT substr(data, 1, 4) a FROM informativo WHERE data <> '' ORDER BY a DESC")
    .map(r => `<option>${r.a}</option>`).join("");
  $("#inf-mes").innerHTML += MESES.map((m, i) => `<option value="${String(i + 1).padStart(2, "0")}">${m}</option>`).join("");
}

function modoInformativos(ligar, id) {
  document.body.classList.toggle("modo-inf", ligar);
  $("#btn-inf").setAttribute("aria-pressed", ligar);
  $("#btn-inf").textContent = ligar ? "Voltar ao catálogo" : "Informativos";
  if (!ligar) return;
  if (id) {  // vindo do produto: limpa filtros para o informativo aparecer na lista
    Object.assign(infEstado, { busca: "", marca: "", cat: "", ano: "", mes: "" });
    ["#inf-busca", "#inf-marca", "#inf-cat", "#inf-ano", "#inf-mes"].forEach(s => $(s).value = "");
    infEstado.sel = id;
  }
  desenharInformativos();
  if (infEstado.sel) mostrarInformativo(infEstado.sel);
  document.querySelector(`.inf[data-inf="${infEstado.sel}"]`)?.scrollIntoView({ block: "nearest" });
}
$("#btn-inf").addEventListener("click", () => modoInformativos(!document.body.classList.contains("modo-inf")));

function desenharInformativos() {
  const w = [], p = [];
  if (infEstado.busca) {
    const palavras = semAcento(infEstado.busca).split(/\s+/).filter(Boolean);
    const cod = pesq(infEstado.busca);
    const partes = [];
    if (palavras.length) { partes.push("(" + palavras.map(() => "i.texto_busca LIKE ?").join(" AND ") + ")"); p.push(...palavras.map(x => "%" + x + "%")); }
    if (cod.length >= 3) {
      partes.push(`i.id IN (SELECT x.informativo_id FROM informativo_produto x JOIN produto pr ON pr.id = x.produto_id
                   WHERE pr.codigo_pesq LIKE ? OR pr.id IN (SELECT produto_id FROM referencia_cruzada WHERE codigo_pesq LIKE ?))`);
      p.push(cod + "%", cod + "%");
    }
    w.push("(" + partes.join(" OR ") + ")");
  }
  if (infEstado.marca) { w.push("i.marca = ?"); p.push(infEstado.marca); }
  if (infEstado.cat) { w.push("i.categoria = ?"); p.push(infEstado.cat); }
  if (infEstado.ano) { w.push("substr(i.data, 1, 4) = ?"); p.push(infEstado.ano); }
  if (infEstado.mes) { w.push("substr(i.data, 6, 2) = ?"); p.push(infEstado.mes); }
  const rows = q(`SELECT i.id, i.numero, i.data, i.titulo, i.imagem${infTemMarca ? ", i.marca" : ""},
                    (SELECT group_concat(pr.codigo, ", ") FROM informativo_produto x JOIN produto pr ON pr.id = x.produto_id WHERE x.informativo_id = i.id) codigos
                  FROM informativo i ${w.length ? "WHERE " + w.join(" AND ") : ""} ORDER BY i.data DESC, i.ordem DESC`, p);
  let html = `<div class="inf-total"><strong>${rows.length}</strong> informativo${rows.length === 1 ? "" : "s"}</div>`;
  if (!rows.length) html += `<p class="vazio-msg">Nenhum informativo com esses filtros.</p>`;
  for (const r of rows)
    html += `<button class="inf${r.id === infEstado.sel ? " ativo" : ""}" data-inf="${r.id}">${miniatura(r, 56)}<span class="num">${esc(r.numero)}<span>${dataCurta(r.data)}</span></span><span class="tit">${esc(r.titulo)}</span><span class="cods">${infTemMarca ? selo(r.marca) : ""}${esc(r.codigos || "")}</span></button>`;
  $("#inf-itens").innerHTML = html;
}
$("#inf-itens").addEventListener("click", e => {
  const b = e.target.closest(".inf"); if (!b) return;
  document.querySelectorAll(".inf.ativo").forEach(x => x.classList.remove("ativo")); b.classList.add("ativo");
  mostrarInformativo(+b.dataset.inf);
});

function mostrarInformativo(id) {
  infEstado.sel = id;
  const i = q("SELECT * FROM informativo WHERE id = ?", [id])[0];
  if (!i) return;
  const prods = q(`SELECT pr.id, pr.codigo, pr.descricao, pr.posicao FROM informativo_produto x JOIN produto pr ON pr.id = x.produto_id
                   WHERE x.informativo_id = ? ORDER BY pr.codigo`, [id]);
  let h = `<div class="etiqueta">${esc(i.numero)}</div>
    <h2>${esc(i.titulo)}</h2>
    <p class="meta">${infTemMarca ? selo(i.marca) : ""}${dataLonga(i.data)} · ${esc(i.categoria)}${i.imagem ? ` · <a class="link-img" href="${esc(i.imagem)}" target="_blank" rel="noopener">Abrir imagem</a>` : ""}</p>
    <h3>Produtos no informativo (${prods.length})</h3>`;
  h += prods.length ? `<div class="prods">${prods.map(r => `<button data-prod="${r.id}"><b>${esc(r.codigo)}</b>${esc(r.descricao)} <small>${esc(r.posicao || "")}</small></button>`).join("")}</div>`
    : "<p>Nenhum produto do catálogo foi identificado neste informativo.</p>";
  h += i.imagem ? `<img class="folha" alt="Informativo ${esc(i.numero)}: ${esc(i.titulo)}" src="${esc(i.imagem)}">` : `<p class="sem-foto">Imagem não disponível.</p>`;
  $("#inf-ver").innerHTML = h;
  $("#inf-ver").scrollTop = 0;
}
$("#inf-ver").addEventListener("click", e => {
  const b = e.target.closest("[data-prod]"); if (!b) return;
  irParaProduto(+b.dataset.prod);
});

function irParaProduto(id) {
  modoInformativos(false);
  const lins = q("SELECT linha_id FROM produto_linha WHERE produto_id = ? ORDER BY linha_id", [id]).map(r => r.linha_id);
  if (lins.length && !lins.includes(estado.linha)) trocarLinha(lins[0]);
  mostrarProduto(id);
  document.querySelectorAll(".item.ativo").forEach(x => x.classList.remove("ativo"));
  document.querySelector(`.item[data-id="${id}"]`)?.classList.add("ativo");
}

let tInf;
$("#inf-busca").addEventListener("input", e => { clearTimeout(tInf); tInf = setTimeout(() => { infEstado.busca = e.target.value.trim(); desenharInformativos(); }, 250); });
for (const [sel, k] of [["#inf-marca", "marca"], ["#inf-cat", "cat"], ["#inf-ano", "ano"], ["#inf-mes", "mes"]])
  $(sel).addEventListener("change", e => { infEstado[k] = e.target.value; desenharInformativos(); });
</script>
